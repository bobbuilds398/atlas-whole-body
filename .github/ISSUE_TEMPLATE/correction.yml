name: Corriger une fiche (Medical or wording correction)
description: Une erreur médicale, une formulation trompeuse, un exercice inadapté, une zone douloureuse mal placée.
title: "Correction : "
labels: ["contenu", "correction"]
body:
  - type: markdown
    attributes:
      value: |
        **Ce formulaire est public.** N’y décrivez pas votre propre situation médicale : nous ne pouvons pas donner d’avis personnel. Urgence : 15 ou 112.
        *This form is public. Do not describe your own medical situation.*
  - type: checkboxes
    id: perso
    attributes:
      label: Avant d’envoyer / Before submitting
      options:
        - label: Je ne partage pas d’informations sur ma santé ou celle d’un proche. / I am not sharing personal health information.
          required: true
  - type: markdown
    attributes:
      value: |
        Merci. Les fiches n'ont pas encore été relues par des professionnels de santé : chaque correction compte.
        You can write in French or English.
  - type: input
    id: articulation
    attributes:
      label: Articulation
      placeholder: "Genou, Épaule, Bas du dos…"
    validations:
      required: true
  - type: input
    id: fiche
    attributes:
      label: Fiche concernée
      placeholder: "Tendinopathie rotulienne"
    validations:
      required: true
  - type: dropdown
    id: partie
    attributes:
      label: Partie à corriger
      multiple: true
      options:
        - Nom ou nom courant
        - Ce que l'on ressent
        - Ce qui se passe
        - Qui est concerné
        - Exercices
        - Signes d'alerte
        - Zone douloureuse ou structures en 3D
        - Classement ou chiffre
        - Questions « où, quand et comment »
    validations:
      required: true
  - type: dropdown
    id: danger
    attributes:
      label: Ce problème peut-il mettre quelqu’un en danger ? / Could this harm someone?
      description: Exercice dangereux, signe d’alerte absent ou faux, urgence non signalée. Ces signalements sont traités en priorité.
      options: ["Non / No", "Oui / Yes", "Je ne sais pas / Not sure"]
    validations:
      required: true
  - type: textarea
    id: probleme
    attributes:
      label: Ce qui ne va pas
    validations:
      required: true
  - type: textarea
    id: proposition
    attributes:
      label: Texte ou changement proposé
      description: Langage courant, phrases courtes, comme le reste de l'atlas.
  - type: textarea
    id: source
    attributes:
      label: Source
      description: Recommandation, revue, article ou manuel. Indispensable pour un changement médical.
      placeholder: "HAS 2019, lien…"
  - type: dropdown
    id: profil
    attributes:
      label: Vous êtes
      options:
        - Kinésithérapeute ou physiothérapeute
        - Médecin
        - Autre professionnel de santé
        - Étudiant en santé
        - Patient ou curieux
        - Je préfère ne pas le dire
