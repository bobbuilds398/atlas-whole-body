name: Signaler un bug (Bug report)
description: Affichage cassé, modèle 3D qui ne charge pas, sélection impossible, problème sur téléphone.
title: "Bug : "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Ce formulaire est public.** N’y décrivez pas votre propre situation médicale : nous ne pouvons pas donner d’avis personnel. Urgence : 15 ou 112.
        *This form is public. Do not describe your own medical situation.*
  - type: checkboxes
    id: perso
    attributes:
      label: Avant d’envoyer / Before submitting
      options:
        - label: Je ne partage pas d’informations sur ma santé ou celle d’un proche. / I am not sharing personal health information.
          required: true
  - type: input
    id: url
    attributes:
      label: Adresse de la page (avec le #…)
      placeholder: "https://bobbuilds398.github.io/atlas-whole-body/#genou/menisque"
  - type: textarea
    id: quoi
    attributes:
      label: Ce qui se passe
      description: Et ce que vous attendiez. Une capture d'écran aide beaucoup.
    validations:
      required: true
  - type: textarea
    id: etapes
    attributes:
      label: Étapes pour reproduire
      placeholder: "1. Ouvrir Genou  2. Couper la couche Os  3. …"
  - type: input
    id: appareil
    attributes:
      label: Appareil et navigateur
      placeholder: "iPhone 14, Safari — ou Windows 11, Firefox 132"
    validations:
      required: true
